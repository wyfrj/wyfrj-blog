          const query = window.matchMedia('(prefers-color-scheme: dark)');
          function applyTheme() {
            let theme = window.localStorage?.getItem('theme') || 'auto';
            let isDark = theme === 'dark' || (theme === 'auto' && query.matches);

        <script>
        
        (function() {
            var video = document.getElementById('bg-video');
            if (!video) return;
            
            var isMobile = /iPhone|iPad|iPod|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            var videoSrc = isMobile ? '/video/background-mobile.mp4' : '/video/background.mp4';
            var loaded = false;
            
            function loadVideo() {
                if (loaded) return;
                loaded = true;
                
                var source = video.querySelector('source');
                if (source) {
                    source.src = videoSrc;
                    video.load();
                    
                    var playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(function() {
                            
                            document.body.addEventListener('touchstart', function playVideo() {
                                video.play().catch(function() {});
                                document.body.removeEventListener('touchstart', playVideo);
                            }, false);
                            
                            document.body.addEventListener('click', function playVideoClick() {
                                video.play().catch(function() {});
                                document.body.removeEventListener('click', playVideoClick);
                            });
                        });
                    }
                }
            }
            
            
            if ('IntersectionObserver' in window) {
                var observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            loadVideo();
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });
                
                observer.observe(video);
            } else {
                
                loadVideo();
            }
            
            
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden && !loaded) {
                    loadVideo();
                }
            });
        })();
        </script>

            var currentPath = window.location.pathname;
            var bottomNavItems = document.querySelectorAll('.bottom-nav-item');
