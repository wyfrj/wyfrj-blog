<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - wyfrg blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #fff;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #4facfe;
            background: rgba(255, 255, 255, 0.15);
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            color: rgba(255, 255, 255, 0.5);
            position: relative;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .divider::before {
            left: 0;
        }
        
        .divider::after {
            right: 0;
        }
        
        .links {
            text-align: center;
            margin-top: 20px;
        }
        
        .links a {
            color: #4facfe;
            text-decoration: none;
            font-size: 14px;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
        
        .message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .message.error {
            background: rgba(255, 82, 82, 0.2);
            border: 1px solid rgba(255, 82, 82, 0.5);
            color: #ff5252;
        }
        
        .message.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            color: #4caf50;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- 登录表单 -->
        <div id="login-form">
            <div class="login-header">
                <h1>欢迎回来</h1>
                <p>登录后即可评论</p>
            </div>
            
            <div id="login-message" class="message"></div>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="login-email" placeholder="请输入邮箱" required>
                </div>
                
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码" required>
                </div>
                
                <button type="submit" class="btn btn-primary">登录</button>
            </form>
            
            <div class="divider">或</div>
            
            <button class="btn btn-secondary" onclick="showRegister()">注册新账号</button>
            
            <div class="links">
                <a href="#" onclick="showForgotPassword()">忘记密码？</a>
            </div>
        </div>
        
        <!-- 注册表单 -->
        <div id="register-form" class="hidden">
            <div class="login-header">
                <h1>创建账号</h1>
                <p>注册后即可评论</p>
            </div>
            
            <div id="register-message" class="message"></div>
            
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="register-email" placeholder="请输入邮箱" required>
                </div>
                
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="register-password" placeholder="请输入密码（至少6位）" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="register-confirm-password" placeholder="请再次输入密码" required>
                </div>
                
                <button type="submit" class="btn btn-primary">注册</button>
            </form>
            
            <div class="divider">或</div>
            
            <button class="btn btn-secondary" onclick="showLogin()">返回登录</button>
        </div>
        
        <!-- 忘记密码表单 -->
        <div id="forgot-form" class="hidden">
            <div class="login-header">
                <h1>重置密码</h1>
                <p>我们将发送重置链接到你的邮箱</p>
            </div>
            
            <div id="forgot-message" class="message"></div>
            
            <form onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="forgot-email" placeholder="请输入注册邮箱" required>
                </div>
                
                <button type="submit" class="btn btn-primary">发送重置链接</button>
            </form>
            
            <div class="links">
                <a href="#" onclick="showLogin()">返回登录</a>
            </div>
        </div>
    </div>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Supabase 配置
        const SUPABASE_URL = 'https://sruhsitckdvvghzssek.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNydWhzaXRja2R2dmdmaHpzc2VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMzc1OTAsImV4cCI6MjA5ODkxMzU5MH0.Q5zInj3yn10n2nMhRVhgXzoAViIM8favchwufGxsdH0';
        
        // 初始化 Supabase 客户端
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // 显示/隐藏表单
        function showLogin() {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('forgot-form').classList.add('hidden');
        }
        
        function showRegister() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
            document.getElementById('forgot-form').classList.add('hidden');
        }
        
        function showForgotPassword() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('forgot-form').classList.remove('hidden');
        }
        
        // 显示消息
        function showMessage(elementId, message, isError = true) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `message ${isError ? 'error' : 'success'}`;
            element.style.display = 'block';
        }
        
        // 登录
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) throw error;
                
                showMessage('login-message', '登录成功！正在跳转...', false);
                
                // 保存登录状态
                localStorage.setItem('supabase.auth.token', JSON.stringify(data.session));
                
                // 跳转到首页
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
                
            } catch (error) {
                showMessage('login-message', error.message || '登录失败，请检查邮箱和密码');
            }
        }
        
        // 注册
        async function handleRegister(event) {
            event.preventDefault();
            
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;
            
            if (password !== confirmPassword) {
                showMessage('register-message', '两次输入的密码不一致');
                return;
            }
            
            try {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password
                });
                
                if (error) throw error;
                
                showMessage('register-message', '注册成功！请检查邮箱确认链接', false);
                
                // 如果不需要邮箱确认，直接登录
                if (data.session) {
                    localStorage.setItem('supabase.auth.token', JSON.stringify(data.session));
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1500);
                }
                
            } catch (error) {
                showMessage('register-message', error.message || '注册失败，请稍后重试');
            }
        }
        
        // 忘记密码
        async function handleForgotPassword(event) {
            event.preventDefault();
            
            const email = document.getElementById('forgot-email').value;
            
            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: 'https://wyfblog.ccwu.cc/reset-password'
                });
                
                if (error) throw error;
                
                showMessage('forgot-message', '重置链接已发送到你的邮箱', false);
                
            } catch (error) {
                showMessage('forgot-message', error.message || '发送失败，请稍后重试');
            }
        }
        
        // 检查是否已登录
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                // 已登录，跳转到首页
                window.location.href = '/';
            }
        }
        
        // 页面加载时检查
        checkAuth();
    </script>
</body>
</html>
