baseURL = 'https://wyfblog.ccwu.cc/'
defaultContentLanguage = 'zh'
title = '我的个人博客'
theme = 'hugo-theme-stack'

# 启用emoji
enableEmoji = true

# 启用代码高亮
pygmentsCodeFences = true
pygmentsUseClasses = true

# 启用RSS
enableRobotsTXT = true

# 分页设置
paginate = 10

# 输出配置
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS", "JSON"]
  taxonomy = ["HTML", "RSS"]

# 主题配置
[params]
  defaultTheme = 'auto'
  showShareButtons = true
  showReadingTime = true
  showToc = true
  TocOpen = true

  [params.homeInfoParams]
    Title = '欢迎来到我的博客'
    Content = '分享技术、生活与思考'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/wyfrj'

# 导航菜单
[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 20

[[menu.main]]
  identifier = 'categories'
  name = '分类'
  url = '/categories/'
  weight = 30

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 40

[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 50

# Markup配置
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    style = 'monokai'
