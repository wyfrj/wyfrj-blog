baseURL = 'https://wyfblog.ccwu.cc/'
defaultContentLanguage = 'zh'
title = '我的个人博客'
theme = 'PaperMod'

[lang]
  [lang.zh]
    languageName = '中文'
    weight = 1
    locale = 'zh-CN'

# 启用emoji
enableEmoji = true

# 启用代码高亮
pygmentsCodeFences = true
pygmentsUseClasses = true

# 启用RSS
enableRobotsTXT = true

# 分页设置
paginate = 10

# 启用搜索
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS", "JSON"]
  taxonomy = ["HTML", "RSS"]

# PaperMod主题配置
[params]
  env = 'production'
  defaultTheme = 'auto'  # 自动切换暗色/亮色模式
  showShareButtons = true
  showReadingTime = true
  showPostNavLinks = true
  showBreadCrumbs = true
  showCodeCopyButtons = true
  showToc = true
  TocOpen = true
  comments = true  # 启用评论

  [params.homeInfoParams]
    Title = '欢迎来到我的博客'
    Content = '分享技术、生活与思考'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/wyfrj'

  [params.editPost]
    URL = 'https://github.com/yourusername/blog/edit/main/content'
    Text = '编辑本文'
    appendFilePath = true

  [params.assets]
    disableHLJS = false

  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

  [params.label]
    text = '我的博客'
    icon = ''
    iconHeight = 35

  [params.share]
    twitter = true
    facebook = true
    reddit = true
    linkedin = true
    pinterest = true
    whatsapp = true
    telegram = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# 导航菜单
[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 20

[[menu.main]]
  identifier = 'categories'
  name = '分类'
  url = '/categories/'
  weight = 30

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 40

[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 50

# 评论系统配置 (Giscus)
[params.giscus]
  dataRepo = "yourusername/blog"
  dataRepoId = ""
  dataCategory = "Announcements"
  dataCategoryId = ""
  dataMapping = "pathname"
  dataStrict = "0"
  dataReactionsEnabled = "1"
  dataEmitMetadata = "0"
  dataInputPosition = "bottom"
  dataTheme = "light"
  dataLang = "zh-CN"
  dataLazyLoading = "0"

# Markup配置
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    style = 'monokai'

# 归档页配置
[params.archives]
  enable = true
