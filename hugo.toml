baseURL = 'https://wyfblog.ccwu.cc/'
defaultContentLanguage = 'zh'
title = 'wyfrg blog'
theme = 'KeepIt'

# Author config
[author]
  name = 'wyf'
  email = ''
  link = 'https://github.com/wyfrj'

# 网站图标
[params.favicon]
  favicon = "/favicon.png"
  icon16x16 = "/favicon.png"
  icon32x32 = "/favicon.png"
  app_touchIcon = "/favicon.png"

# 启用emoji
enableEmoji = true

# 启用代码高亮
pygmentsCodeFences = true
pygmentsUseClasses = true

# 启用RSS
enableRobotsTXT = true

# 启用Sitemap
enableSitemap = true

# 分页设置
paginate = 10

# 输出配置
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS", "JSON"]
  taxonomy = ["HTML", "RSS"]

# Sitemap配置
[sitemap]
  changefreq = "daily"
  filename = "sitemap.xml"
  priority = 0.5

# 主题配置
[params]
  defaultTheme = 'auto'
  showShareButtons = true
  showReadingTime = true
  showToc = true
  TocOpen = true
  comments = true
  
  # 描述信息
  description = "分享技术、生活与思考的个人博客"

  # Header config
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      logo = ""
      name = "wyfrg blog"
      pre = ""
      post = ""
      typeit = false

  # Footer config
  [params.footer]
    enable = true
    custom = ""
    hugo = true
    copyright = true
    author = true
    since = 2022

  # Open Graph配置
  [params.opengraph]
    enable = true
    logo = "/images/logo.png"
    
  # Twitter卡片
  [params.twitter]
    enable = true
    card = "summary_large_image"

  # 分享配置
  [params.share]
    enable = true
    Line = false
    
  # 相关文章配置
  [params.related]
    enable = true
    maxSameCategory = 3
    includeNewer = true
    threshold = 80
    toLower = true
    
    [[params.related.indices]]
      name = "tags"
      weight = 100
    [[params.related.indices]]
      name = "categories"
      weight = 80

  # 页面级评论配置
  [params.page]
    [params.page.comment]
      enable = true

      # Giscus评论系统配置
      [params.page.comment.giscus]
        enable = true
        repo = "wyfrj/wyfrj-blog"
        repoId = "R_kgDOTOO8zg"
        category = "Announcements"
        categoryId = "DIC_kwDOTOO8zs4DAnGd"
        lang = "zh-CN"
        mapping = "pathname"
        reactionsEnabled = "1"
        emitMetadata = "0"
        inputPosition = "bottom"
        lazyLoading = false
        lightTheme = "light"
        darkTheme = "dark"

  # 全局评论配置
  [params.comment]
    enable = true
    [params.comment.giscus]
      enable = true
      repo = "wyfrj/wyfrj-blog"
      repoId = "R_kgDOTOO8zg"
      category = "Announcements"
      categoryId = "DIC_kwDOTOO8zs4DAnGd"
      lang = "zh-CN"
      mapping = "pathname"
      reactionsEnabled = "1"
      emitMetadata = "0"
      inputPosition = "bottom"
      lazyLoading = false
      lightTheme = "light"
      darkTheme = "dark"

  [params.author]
    name = 'wyf'
    link = 'https://github.com/wyfrj'

  [params.homeInfo]
    title = "wyfrg blog"
    subtitle = "加载中..."
    typeit = true

  [params.home.profile]
    enable = true
    avatarURL = ""
    title = "wyfrg blog"
    subtitle = ""
    typeit = false
    disclaimer = ""

  # TypeIt 配置
  [params.typeit]
    speed = 100
    cursorSpeed = 1000
    cursorChar = "|"
    duration = -1
    startDelete = false
    breakLines = false
    startDelay = 0
    lifeLike = true
    loop = false

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/wyfrj'

  # CDN配置 - 使用本地资源
  [params.cdn]
    data = "bootcdn.yml"

  # 搜索配置
  [params.search]
    enable = true
    type = "lunr"
    contentLength = 4000
    placeholder = ""
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    absoluteURL = false

# 导航菜单
[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 20

[[menu.main]]
  identifier = 'categories'
  name = '分类'
  url = '/categories/'
  weight = 30

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 40

# Markup配置
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    style = 'monokai'
