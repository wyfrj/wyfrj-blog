baseURL = 'https://wyfblog.ccwu.cc/'
defaultContentLanguage = 'zh'
title = 'wyfrg blog'
theme = 'LoveIt'

# 启用emoji
enableEmoji = true

# 启用代码高亮
pygmentsCodeFences = true
pygmentsUseClasses = true

# 启用RSS
enableRobotsTXT = true

# 分页设置
paginate = 10

# 输出配置
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS", "JSON"]
  taxonomy = ["HTML", "RSS"]

# 主题配置
[params]
  defaultTheme = 'auto'
  showShareButtons = false
  showReadingTime = true
  showToc = true
  TocOpen = true
  comments = false

  [params.author]
    name = 'wyf'
    link = 'https://github.com/wyfrj'

  [params.homeInfo]
    title = "wyfrg blog"
    subtitle = "分享技术、生活与思考"

  [params.home.profile]
    enable = true
    avatarURL = ""
    title = "wyfrg blog"
    subtitle = ""
    typeit = false
    disclaimer = ""

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/wyfrj'

  # 搜索配置
  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    placeholder = ""
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    absoluteURL = false
    [params.search.fuse]
      isCaseSensitive = false
      minMatchCharLength = 2
      findAllMatches = false
      location = 0
      threshold = 0.3
      distance = 100
      ignoreLocation = false

# 导航菜单
[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 20

[[menu.main]]
  identifier = 'categories'
  name = '分类'
  url = '/categories/'
  weight = 30

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 40

# Markup配置
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    style = 'monokai'
